services:
  db:
    image: postgres:16-alpine
    container_name: datadynamo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datadynamo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datadynamo_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-datadynamo_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datadynamo_user} -d ${POSTGRES_DB:-datadynamo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: datadynamo-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://datadynamo_user:datadynamo_secure_pass@db:5432/datadynamo_db}
      ARTIFACTS_DIR: /app/artifacts
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: datadynamo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
