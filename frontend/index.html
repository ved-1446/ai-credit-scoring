<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Data Dynamo — Machine Learning Credit Scoring and Risk Governance Platform powered by XGBoost and SHAP explainability." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6f1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161917" />
    <title>Data Dynamo — AI Credit Scoring</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('dd-theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
